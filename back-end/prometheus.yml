global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'spring-boot-services'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets:
          - 'gateway-service:8080/auth-service'
          - 'gateway-service:8080/member-service'
          - 'gateway-service:8080/coupon-service'
          - 'gateway-service:8080/rank-service'
          - 'gateway-service:8080/payment-service'
          - 'gateway-service:8080/class-service'
          - 'gateway-service:8080/chat-service'
          - 'gateway-service:8080/notification-service'
