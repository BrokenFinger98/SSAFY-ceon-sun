global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'auth-service'
    static_configs:
      - targets: ['gateway-service:8080/auth-service/actuator/prometheus']

  - job_name: 'member-service'
    static_configs:
      - targets: ['gateway-service:8080/member-service/actuator/prometheus']

  - job_name: 'coupon-service'
    static_configs:
      - targets: ['gateway-service:8080/coupon-service/actuator/prometheus']

  - job_name: 'rank-service'
    static_configs:
      - targets: ['gateway-service:8080/rank-service/actuator/prometheus']

  - job_name: 'payment-service'
    static_configs:
      - targets: ['gateway-service:8080/payment-service/actuator/prometheus']

  - job_name: 'class-service'
    static_configs:
      - targets: ['gateway-service:8080/class-service/actuator/prometheus']

  - job_name: 'chat-service'
    static_configs:
      - targets: ['gateway-service:8080/chat-service/actuator/prometheus']

  - job_name: 'notification-service'
    static_configs:
      - targets: ['gateway-service:8080/notification-service/actuator/prometheus']
